<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQL Migration Assessment Report</title>
    <style>
    :root {
    --report-header: #4C346E;
    --report-accent: #5649B0;
    --report-accent-hover: #483C97;
    --report-canvas: #FFFFFF;
    --report-comparison: #E8E8E9;
    --report-feature-surface: #FAFCFE;
    --report-recommended-header: #DDDCE9;
    --report-recommended: #F2F0FE;
    --report-featured: #EBE9F6;
    --report-configuration-surface: #F0F0F0;
    --report-border: #D1D1D1;
    --report-text: #1B1B1B;
    --report-muted: #5B5B5B;
    --report-link: #0F6CBD;
    --report-success: #0F7B0F;
    --report-caution: #9D5D00;
    --report-issue: #BC4B09;
    --report-warning: #B27C00;
    --report-focus: #005FB8;
}
* { box-sizing: border-box; }
body { background:var(--report-canvas); color:var(--report-text); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size:14px; margin:0; }
/* Form controls do not inherit the document font, so without this the search boxes, filter pills,
   pagination and dropdown buttons all render in the browser's default UI font while the rest of
   the report is Segoe UI. */
button, input, select, textarea { font-family: inherit; }

/* ── report header ───────────────────────────────── */
.report-header { background:var(--report-header); padding:14px 0; }
/* full bleed, unlike the body content, so the title and the Microsoft mark stay pinned to the
   left and right edges rather than being pulled inward on wide screens */
.report-header-inner { width:100%; box-sizing:border-box; padding:0 24px; display:flex; align-items:center; justify-content:space-between; }
.report-header-inner::after { content:"Microsoft"; color:#fff; font-size:14px; font-weight:400; }
.report-header-title { font-size:16px; font-weight:400; color:#fff; }
.report-header-sub   { font-size:.78rem; color:#e9d8fb; margin-top:2px; }
.report-shell { max-width:1400px; margin:0 auto; padding:20px 24px; }

/* ── section card ─────────────────────────────────── */
.sec-card { background:#fff; border-radius:8px; padding:20px 24px; box-shadow:0 1px 3px rgba(0,0,0,.07); margin-bottom:16px; }
.sec-title { font-size:.95rem; font-weight:600; color:#111827; margin-bottom:14px; }
.info-tile .lbl { font-size:.78rem; font-weight:600; color:#374151; margin-bottom:4px; }
.info-tile .val { font-size:.88rem; font-weight:600; color:#111827; }
.info-tile .sub { font-size:.72rem; color:#9ca3af; margin-top:2px; }
.db-assessed-cards { display:flex; gap:12px; margin-bottom:16px; }
.db-assessed-card { flex:1; border:1px solid #e5e7eb; border-radius:6px; padding:12px 16px; background:#f9fafb; }
.db-assessed-card-label { font-size:.78rem; color:#6b7280; font-weight:600; margin-bottom:6px; }
.db-assessed-card-num { font-size:1.3rem; font-weight:700; color:#111827; }
.db-assessed-tbl { width:100%; border-collapse:collapse; }
.db-assessed-tbl th { text-align:left; font-size:.7rem; font-weight:700; color:#6b7280; padding:8px 10px; border-bottom:2px solid #e5e7eb; background:#f9fafb; }
.db-assessed-tbl td { font-size:.82rem; padding:8px 10px; border-bottom:1px solid #f3f4f6; color:#374151; }
.db-assessed-tbl tbody tr:hover td { background:#f9fafb; }
.db-assessed { color:var(--report-success); font-weight:500; }
.db-not-assessed { color:var(--report-issue); font-weight:500; }
.db-state-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.db-assessed-search { width:100%; border:1px solid #d1d5db; border-radius:4px; padding:7px 12px; font-size:.82rem; outline:none; margin-bottom:12px; }
.db-assessed-search:focus { border-color:#3b82f6; }

/* filter row: search plus the two dropdowns, matching the design */
.db-filter-row { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.db-search-wrap { position:relative; flex:1 1 200px; min-width:180px; }
.db-search-wrap .db-assessed-search { margin-bottom:0; padding-right:30px; }
.db-search-icon { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:.78rem; color:#6b7280; pointer-events:none; }
.db-filter-select { border:1px solid #d1d5db; border-radius:16px; padding:7px 12px; font-size:.8rem; color:#374151; background:#fff; outline:none; cursor:pointer; }
.db-filter-select:focus { border-color:#3b82f6; }
.db-name-cell { max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* shared info tooltip, shown on hover or keyboard focus of an info glyph */
.info-tip { position:relative; display:inline-block; margin-left:5px; color:var(--report-muted); cursor:help; outline:none; }
.info-glyph { display:inline-block; width:14px; height:14px; flex:0 0 14px; vertical-align:-2px; }
.action-icon { display:inline-block; width:16px; height:16px; flex:0 0 16px; vertical-align:-3px; }
.info-tip-box { visibility:hidden; opacity:0; position:absolute; left:50%; transform:translateX(-50%); bottom:calc(100% + 7px);
    width:230px; background:#fff; color:#1f2937; border:1px solid #d1d5db; border-radius:4px; padding:8px 10px;
    font-size:.75rem; font-weight:400; line-height:1.45; box-shadow:0 4px 14px rgba(0,0,0,.16); z-index:40; transition:opacity .12s; text-align:left; white-space:normal; }
.info-tip:hover .info-tip-box, .info-tip:focus .info-tip-box { visibility:visible; opacity:1; }
/* drops below the glyph instead, for controls near the top of the page */
.info-tip-box.below { bottom:auto; top:calc(100% + 7px); left:0; transform:none; width:250px; }

/* pager */
.db-pager { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 10px 4px; border-top:1px solid #f3f4f6; flex-wrap:wrap; }
.db-pager-range { font-size:.78rem; color:#6b7280; }
.db-pager-pages { display:flex; align-items:center; gap:2px; }
.db-pager-page, .db-pager-nav { border:none; background:none; cursor:pointer; font-size:.8rem; color:#2563eb; padding:3px 8px; border-radius:4px; line-height:1.4; }
.db-pager-page:hover:not(.active), .db-pager-nav:hover:not([disabled]) { background:#eff6ff; }
.db-pager-page.active { color:#111827; font-weight:600; cursor:default; }
.db-pager-nav[disabled] { color:#d1d5db; cursor:default; }
.tgt-card-outer > .tgt-card { flex:1; }
.tgt-card { border:1.5px solid #e5e7eb; border-radius:8px; padding:15px; background:#fff; cursor:default; transition:border-color .15s,box-shadow .15s; user-select:none; }
.tgt-card:hover:not(.selected){ box-shadow:0 2px 8px rgba(0,0,0,.1); }
.tgt-card.selected { background:#fff; border:1.5px solid #e5e7eb; box-shadow:none; }
.tgt-card.recommended { border:1.5px solid #e5e7eb; background:#eff6ff; }
.tgt-card.recommended.selected { border:1.5px solid #e5e7eb; background:#eff6ff; box-shadow:none; }

/* ── top info block (Figma) ───────────────────────── */
.top-info { margin:4px 0 18px; }
.top-gen { font-size:.78rem; color:#6b7280; margin-bottom:14px; }
.top-cols { display:flex; gap:64px; }
.top-lbl { font-size:.8rem; color:#5b5b5b; margin-bottom:4px; }
.top-link { font-size:14px; color:var(--report-link); text-decoration:none; cursor:pointer; font-weight:400; }
.top-link:hover { text-decoration:underline; }
.top-rule { border:none; border-top:1px solid #e1e1e1; margin:18px 0 0; }

/* ── migration targets (Figma) ────────────────────── */
.mt-sec { margin-bottom:24px; }
.mt-title { font-size:1.05rem; font-weight:600; color:#1b1b1b; margin:10px 0 12px; }

/* controls bar */
/* controls sit inside a light grey strip spanning the content width, with the
   licensing note right-aligned on the same row. Kept compact so the note stays on
   the row at as narrow a viewport as possible before wrapping. */
.ctl-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 13px; margin-bottom:14px;
    background:#f5f5f5; border-radius:4px; padding:10px 14px; }
.ctl { display:flex; align-items:center; gap:6px; }
.ctl-lbl { font-size:.75rem; color:#3b3b3b; white-space:nowrap; display:inline-flex; align-items:center; }
/* selects hug their content so the strip reads as evenly spaced pairs */
.ctl-sel { font-size:.75rem; color:#1b1b1b; height:26px; padding:0 3px; border:1px solid #c4c4c4; border-radius:4px;
    background:#fff; max-width:158px; box-sizing:border-box; }
.ctl-sel:disabled { color:#8a8886; background:#f5f5f5; cursor:not-allowed; }
.ctl-note { margin-left:auto; font-size:.73rem; color:#5b5b5b; white-space:nowrap; }

/* Both tables share the same colgroup and inset so comparison and result columns stay aligned. */
.mt-card { overflow-x:auto; border:1px solid var(--report-border); border-radius:6px; background:var(--report-canvas); }
.mt-card-content { min-width:960px; }
.mt-comparison { background:var(--report-comparison); padding:0 16px 16px; }
.mt-assessment { padding:16px; }
.mt-result-title { font-size:12px; font-weight:600; margin:0 0 10px; }
/* Keep inherited defaults on the table so cell-specific typography and colors can override them. */
.mt-table { width:100%; border-collapse:collapse; table-layout:fixed; color:var(--report-text); font-size:12px; }
.mt-comparison-table { border-collapse:separate; border-spacing:0; }
.mt-results-table { border:1px solid var(--report-border); background:var(--report-canvas); }
.mt-results-table td { border:1px solid var(--report-border); }
.mt-row-cost { height:60px; }
.mt-row-readiness, .mt-row-configuration { height:90px; }
.mt-table-headers th { position:relative; padding:0; border:0; height:0; line-height:0; }
.report-sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap; line-height:normal; border:0; }
.mt-col-lbl { width:230px; }
.mt-table td { padding:16px; vertical-align:top; }
.mt-lbl { color:var(--report-text); font-size:12px; font-weight:400; }
.mt-gray { background:var(--report-comparison); }
.mt-recgray { background:var(--report-recommended-header); }
.mt-rec { background:var(--report-recommended); }

/* recommended banner */
.mt-bannerrow td { padding:0 !important; height:30px; vertical-align:middle; }
.mt-hp { background:var(--report-accent); color:#fff; text-align:center; vertical-align:middle; line-height:30px; font-size:11px; font-weight:600; letter-spacing:.14em; }

.mt-targetrow td { padding-top:14px; padding-bottom:14px; }
.mt-targetrow td:first-child { padding-left:0; }
.mt-tname { font-size:14px; font-weight:600; color:var(--report-text); }

/* collapsible feature groups */
.mt-grp { cursor:pointer; }
.mt-grp:hover .mt-grplbl { color:var(--report-accent); }
.mt-grp td { background:var(--report-feature-surface); border-top:1px solid var(--report-border); border-bottom:1px solid var(--report-border); padding:8px 12px; }
.mt-grp td:first-child { border-left:1px solid var(--report-border); border-radius:4px 0 0 4px; }
.mt-grp td:last-child { border-right:1px solid var(--report-border); border-radius:0 4px 4px 0; }
.mt-grp td.mt-rec { background:var(--report-recommended); }
.mt-disclosure { display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:0; border:none; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.mt-disclosure:focus-visible { outline:2px solid var(--report-focus); outline-offset:3px; }
.mt-chevron { width:12px; height:12px; flex:0 0 12px; }
.mt-ratecell { white-space:nowrap; }
.mt-bar { display:inline-block; width:56px; height:7px; border-radius:4px; background:#cfcfd1; overflow:hidden; vertical-align:middle; margin-right:8px; }
.mt-bar-fill { display:block; height:100%; }
.mt-rating { font-weight:600; }
.mt-sub td { background:var(--report-feature-surface); font-size:12px; line-height:1.5; border-bottom:1px solid var(--report-border); }
.mt-sub td:first-child { border-left:1px solid var(--report-border); }
.mt-sub td:last-child { border-right:1px solid var(--report-border); }
.mt-sub td.mt-rec { background:var(--report-recommended); }
.mt-sublbl { padding-left:32px !important; color:#5b5b5b; font-weight:400; }
.mt-subcell { color:#1b1b1b; }

/* assessment result */
.mt-cost { font-size:16px; font-weight:400; }
.mt-rdy-line { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.mt-rdy { font-size:14px; font-weight:400; }
.ic { display:inline-block; width:16px; height:16px; flex:0 0 16px; vertical-align:-3px; }
.ic-ok { color:var(--report-success); }
.ic-cond { color:var(--report-caution); }
.ic-iss { color:var(--report-issue); }
.ic-tri { color:var(--report-warning); }
.ic-mark { fill:none; stroke:#fff; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.ic-dot { fill:#fff; }
.mt-info { color:#5b5b5b; cursor:help; font-size:.78rem; }
.mt-pill { display:inline-flex; align-items:center; background:transparent; color:#5b5b5b; border:1px solid #8a8886; border-radius:999px; padding:2px 10px; font-size:12px; line-height:18px; font-weight:400; text-align:left; }
.mt-links { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; }
.mt-links a { display:inline-flex; align-items:center; gap:4px; color:var(--report-link); text-decoration:none; font-size:12px; cursor:pointer; }
.mt-links a:hover { text-decoration:underline; }
.mt-cfg { font-size:14px; font-weight:400; }
.mt-featured { display:inline-flex; align-items:center; gap:6px; width:auto; max-width:100%; margin-top:8px; background:var(--report-featured); border:1px solid transparent; border-radius:2px; padding:4px 8px; font-size:12px; line-height:1.5; font-weight:400; text-align:left; color:var(--report-accent); cursor:pointer; }
.mt-featured:hover { border-color:var(--report-accent); }
.mt-featured:focus-visible { outline:2px solid var(--report-focus); outline-offset:2px; }
.mt-featured-label { text-decoration:underline; text-underline-offset:2px; }
.mt-star { display:inline-block; color:var(--report-accent); width:16px; height:16px; flex:0 0 16px; vertical-align:-3px; }
.mt-actions td { padding-top:14px; padding-bottom:18px; }
.mt-btn { display:inline-block; background:var(--report-accent); color:#fff; border:1px solid transparent; border-radius:6px; padding:6px 14px; width:187px; max-width:100%; min-height:32px; font-size:14px; font-weight:400; cursor:pointer; }
.mt-btn:hover { background:var(--report-accent-hover); }
.mt-btn:focus-visible { outline:2px solid var(--report-focus); outline-offset:2px; }

/* bottom collapsibles */
.mt-collapse { cursor:pointer; }
.mt-collapse td { font-size:12px; font-weight:600; color:var(--report-text); padding:14px 16px; }
.mt-collapse:hover td { color:var(--report-accent); }
.mt-stat { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px; }
.mt-stat-l { display:flex; align-items:center; gap:6px; color:#3b3b3b; }
.mt-stat-v { margin-left:auto; font-weight:600; color:#1b1b1b; }
.mt-note { margin-top:10px; color:#5b5b5b; font-size:11px; line-height:1.45; }
.db-count-block .num  { font-size:1.35rem; font-weight:700; color:#111827; padding-top:4px; }

/* ── compatibility block ──────────────────────────── */
.compat-block { margin-bottom:32px; margin-top:30px; }
.compat-hdr { font-weight:600; font-size:.9rem; margin-bottom:6px; display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
.compat-hdr:hover { color:#374151; }
.compat-arr { font-size:.58rem; color:#6b7280; width:10px; flex-shrink:0; line-height:1; }
.compat-sub { font-size:.78rem; color:#6b7280; margin-bottom:10px; }

/* ── filter bar ───────────────────────────────────── */
.filter-bar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.filter-search-wrap { position:relative; display:flex; align-items:center; }
.filter-search-wrap .search-icon { position:absolute; left:8px; top:50%; transform:translateY(-50%); color:#9ca3af; font-size:.8rem; pointer-events:none; display:flex; align-items:center; }
.filter-search { border:1px solid #d1d5db; border-radius:20px; padding:5px 10px 5px 28px; font-size:.78rem; color:#374151; outline:none; width:160px; background:#fff; }
.filter-search:focus { border-color:#3b82f6; }
.filter-search-wrap .clr-btn { position:absolute; right:8px; background:none; border:none; cursor:pointer; color:#9ca3af; font-size:.75rem; padding:0; line-height:1; }

/* ── pill button ──────────────────────────────────── */
.filter-pill-wrap { position:relative; }
.filter-pill { border:1px solid #d1d5db; border-radius:20px; background:#fff; padding:5px 12px; font-size:.78rem; color:#374151; cursor:pointer; white-space:nowrap; }
.filter-pill:hover { background:#f9fafb; }
.filter-pill.active { background:#e0edff; border-color:#3b82f6; color:#1d4ed8; }

/* ── dropdown panel ───────────────────────────────── */
.dd-backdrop { position:fixed; inset:0; z-index:98; }
.dd-panel { position:absolute; top:calc(100% + 4px); left:0; z-index:99; background:#fff; border:1px solid #e5e7eb; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.12); min-width:220px; padding:0; overflow:hidden; }
.dd-panel-title { font-weight:600; font-size:.85rem; padding:12px 14px 4px; color:#111827; }
.dd-val-label { font-size:.72rem; color:#6b7280; padding:0 14px 6px; }
.dd-search-wrap { padding:0 10px 8px; position:relative; }
.dd-search { width:100%; border:1px solid #e5e7eb; border-radius:4px; padding:5px 8px 5px 26px; font-size:.78rem; color:#374151; outline:none; background:#f9fafb; }
.dd-search-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:#9ca3af; font-size:.75rem; pointer-events:none; display:flex; align-items:center; }
.dd-items { max-height:200px; overflow-y:auto; border-top:1px solid #f3f4f6; border-bottom:1px solid #f3f4f6; }
.dd-item { display:flex; align-items:center; gap:8px; padding:8px 14px; font-size:.83rem; color:#374151; cursor:pointer; border-bottom:1px solid #f9fafb; }
.dd-item:hover { background:#f9fafb; }
.dd-item input[type=checkbox] { accent-color:#2563eb; width:15px; height:15px; cursor:pointer; flex-shrink:0; }
.dd-actions { display:flex; gap:8px; padding:10px 14px; }
.dd-btn-apply  { flex:1; background:#2563eb; color:#fff; border:none; border-radius:4px; padding:6px 0; font-size:.8rem; font-weight:600; cursor:pointer; }
.dd-btn-apply:hover { background:#1d4ed8; }
.dd-btn-cancel { flex:1; background:#fff; color:#374151; border:1px solid #d1d5db; border-radius:4px; padding:6px 0; font-size:.8rem; cursor:pointer; }
.dd-btn-cancel:hover { background:#f9fafb; }

/* ── findings table ───────────────────────────────── */
.findings-tbl-wrap { overflow-x:auto; }
.findings-tbl { width:100%; border-collapse:collapse; }
.findings-tbl thead tr { border-bottom:2px solid #e5e7eb; }
.findings-tbl th { font-size:.7rem; color:#6b7280; font-weight:700; padding:7px 10px; background:#f9fafb; text-align:left; }
.findings-tbl td { font-size:.82rem; padding:8px 10px; border-bottom:1px solid #f3f4f6; vertical-align:top; color:#374151; }
.findings-tbl tbody tr:hover td { background:#eff6ff; }
.finding-row { cursor:pointer; }
.type-text { color:#111827; font-weight:400; font-size:.82rem; }
.finding-title { color:#1d4ed8; font-size:.82rem; text-decoration:underline; }
.finding-title:focus-visible { outline:2px solid var(--report-focus); outline-offset:2px; }
.no-findings   { font-size:.82rem; font-style:italic; color:#6b7280; padding:12px 0; }
.alert-warning { background:#fefce8; border:1px solid #fde68a; color:#92400e; padding:12px 16px; border-radius:6px; font-size:.85rem; }
.container-fluid { width:100%; }
.text-center { text-align:center; }

/* ── finding detail pane ────────────────────────────── */
.finding-pane-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:200; }
.finding-pane { position:fixed; top:0; right:0; height:100%; width:680px; max-width:95vw; background:#fff; box-shadow:-4px 0 24px rgba(0,0,0,.15); z-index:201; overflow-y:auto; flex-direction:column; }
.finding-pane.full-pane { left:0; width:100%; max-width:100%; box-shadow:none; }
.finding-pane-hdr { display:flex; flex-direction:column; align-items:flex-start; padding:20px 24px 18px; border-bottom:1px solid #e5e7eb; position:relative; }
.fp-heading { font-size:1.1rem; font-weight:700; color:#111827; }
.finding-pane-close { background:#fff; border:1px solid #d1d5db; border-radius:4px; cursor:pointer; color:#374151; font-size:.88rem; padding:3px 8px; line-height:1.4; }
.finding-pane-close:hover { background:#f3f4f6; }
.finding-pane-body { padding:4px 24px 24px; }
.fp-row { display:grid; grid-template-columns:140px 1fr; gap:16px; padding:14px 0; border-bottom:1px solid #f3f4f6; align-items:start; }
.fp-row-last { border-bottom:none; }
.fp-label { font-size:.82rem; color:#6b7280; }
.fp-value { font-size:.82rem; color:#111827; line-height:1.5; }
.fp-learn-link { color:#1d4ed8; text-decoration:none; font-size:.82rem; }
.fp-learn-link:hover { text-decoration:underline; }
.fp-section-title { font-size:.9rem; font-weight:600; color:#111827; margin-top:22px; margin-bottom:10px; }
.fp-tbl { width:100%; border-collapse:collapse; }
.fp-tbl th { text-align:left; font-size:.7rem; font-weight:700; color:#6b7280; padding:7px 10px; border-bottom:2px solid #e5e7eb; background:#f9fafb; }
.fp-tbl td { font-size:.82rem; padding:8px 10px; border-bottom:1px solid #f3f4f6; color:#374151; }
.fp-no-objects { font-size:.82rem; color:#6b7280; font-style:italic; margin-top:8px; }

var PRICING_BASES = [
    { key:"payg",        label:lbl("PayAsYouGoOption"),             field:null,          group:null },
    { key:"reserved1yr", label:lbl("PricingBasisReserved1YrLabel"), field:"reserved1Yr", group:"reservations" },
    { key:"reserved3yr", label:lbl("PricingBasisReserved3YrLabel"), field:"reserved3Yr", group:"reservations" },
    { key:"savings1yr",  label:lbl("PricingBasisSavings1YrLabel"),  field:"savings1Yr",  group:"savings" },
    { key:"savings3yr",  label:lbl("PricingBasisSavings3YrLabel"),  field:"savings3Yr",  group:"savings" }
];
// Reservations and savings plans are different commitment products, so they are offered as
// separate groups rather than one flat list.
var PRICING_BASIS_GROUPS = [
    { key:"reservations", label:lbl("PricingGroupReservations") },
    { key:"savings",      label:lbl("PricingGroupSavingsPlans") }
];
// What the reader is choosing when they pick a commitment. Shown beneath the radio buttons for the
// selected one, so the difference between a reservation and a savings plan is visible at the point
// of choosing rather than assumed.
var PRICING_BASIS_NOTES = {
    payg:        lbl("PricingBasisNotePayg"),
    reserved1yr: lbl("PricingBasisNoteReserved1Yr"),
    reserved3yr: lbl("PricingBasisNoteReserved3Yr"),
    savings1yr:  lbl("PricingBasisNoteSavings1Yr"),
    savings3yr:  lbl("PricingBasisNoteSavings3Yr")
};
function basisNote(key){ return PRICING_BASIS_NOTES[key]||""; }
function basesInGroup(g){ return availableBases().filter(function(b){ return b.group===g; }); }
function currentBasis(){ for(var i=0;i<PRICING_BASES.length;i++){ if(PRICING_BASES[i].key===_pricingBasis) return PRICING_BASES[i]; } return PRICING_BASES[0]; }
// A real published price for the selected basis, or null when the pricing data omits it.
function commitmentPrice(rec,basis){
    if(!rec||!basis||!basis.field) return null;
    var c=rec.commitments;
    if(!c) return null;
    var v=c[basis.field];
    return (v==null)?null:v;
}
// The commitment list is the superset of what any target offers. Azure does not sell the same
// commitments everywhere, a three year savings plan exists for the VM target but not for the PaaS
// ones, and requiring every target to publish a price hid that option from the VM page where it is
// real. A target with no price for the selected commitment shows a dash, which says plainly that
// the price is not available there rather than implying the commitment does not exist.
function basisAvailable(basis){
    if(!basis.field) return true;
    var pd=pricingModel(); if(!pd||!pd.recommendations) return false;
    for(var i=0;i<TARGET_ORDER.length;i++){
        var rec=pd.recommendations[TARGET_ORDER[i]];
        if(!rec||rec.computeCost==null) continue;
        if(commitmentPrice(rec,basis)!=null) return true;
    }
    return false;
}
function availableBases(){ return PRICING_BASES.filter(basisAvailable); }
function adjustedCosts(rec){
    if(!rec) return { compute:null, storage:null, total:null, estimated:false };
    var basis=currentBasis();
    var real=commitmentPrice(rec,basis);
    var compute=(real!=null)?real:(basis.field?null:rec.computeCost);
    var storage=rec.storageCost==null?null:rec.storageCost;
    // A total is only meaningful when the compute part is known. Adding storage to an unknown
    // compute would print a small number that reads as a real monthly cost and would make a target
    // whose price is simply unavailable look like the cheapest one on the page.
    var total=(compute==null)?null:(compute+(storage||0));
    return { compute:compute, storage:storage, total:total, estimated:false };
}
// Re-rendering replaces the whole container, which would otherwise jump the reader back to the
// top of the report every time they price a different commitment.
function withPreservedScroll(fn){
    var y=window.pageYOffset||document.documentElement.scrollTop||0;
    var card=document.querySelector(".mt-card");
    var x=card?card.scrollLeft:null;
    fn();
    card=document.querySelector(".mt-card");
    if(card&&x!==null)card.scrollLeft=x;
    window.scrollTo(0,y);
}
// The detail pane does not scroll the window. It is a fixed panel whose inner .dp-scroll element is
// the real scroll container, with .tc-left scrolling independently inside the target configuration
// tab. Replacing the pane's markup destroys both and the reader lands back at the top, so their
// offsets are carried across the re-render by position rather than by identity, the elements being
// newly created ones.
function paneScrollOffsets(pane){
    if(!pane)return [];
    var out=[];
    var nodes=pane.querySelectorAll(".dp-scroll, .tc-left");
    for(var i=0;i<nodes.length;i++)out.push(nodes[i].scrollTop);
    return out;
}
function restorePaneScrollOffsets(pane,offsets){
    if(!pane||!offsets||!offsets.length)return;
    var nodes=pane.querySelectorAll(".dp-scroll, .tc-left");
    for(var i=0;i<nodes.length&&i<offsets.length;i++)nodes[i].scrollTop=offsets[i];
}
function withPreservedPaneScroll(pane,fn){
    var offsets=paneScrollOffsets(pane);
    fn();
    restorePaneScrollOffsets(pane,offsets);
}

function isIssueType(c){ return c==="Issue"||c==="BlockingIssue"||c==="Critical"; }
function findingDesc(a,platform){
    var resourceKey=findingDescriptionKey(a,platform);
    var resourceDescription=resourceKey?lbl(resourceKey):"";
    if(resourceDescription&&resourceDescription!==resourceKey)return resourceDescription;
    // RuleMetadata carries a concise, already localized Id that reads as the finding's title, and a
    // Description that is a long paragraph. When there is no shipped label for this rule the Id is
    // what belongs in the list; the paragraph is left for the detail pane.
    if(a&&a.RuleMetadata&&a.RuleMetadata.Id)return a.RuleMetadata.Id;
    if(a&&a.RuleMetadata&&a.RuleMetadata.Description)return a.RuleMetadata.Description;
    if(a&&a.MoreInformation)return a.MoreInformation;
    return a&&a.FeatureId?a.FeatureId:lbl("FindingDescriptionUnavailable");
}

function dbReadinessCounts(dbs,p){
    var rd=0,wn=0,nr=0;
    if(!dbs)return{ready:0,warn:0,notReady:0};
    dbs.forEach(function(db){
        var r=db.TargetReadinesses&&db.TargetReadinesses[p]; if(!r)return;
        var hasFindings=db.DatabaseAssessments&&db.DatabaseAssessments.some(function(a){return a.AppliesToMigrationTargetPlatform===p;});
        if(r.RecommendationStatus==="Ready"&&hasFindings){wn++;}
        else if(r.RecommendationStatus==="Ready"){rd++;}
        else if(r.RecommendationStatus==="Unknown"){}
        else{nr++;}
    });
    return{ready:rd,warn:wn,notReady:nr};
}
function isDbAssessed(db){
    if(!db||!db.TargetReadinesses)return false;
    for(var k in db.TargetReadinesses){
        if(db.TargetReadinesses.hasOwnProperty(k) && db.TargetReadinesses[k] && db.TargetReadinesses[k].RecommendationStatus!=="Unknown") return true;
    }
    return false;
}
function parseCompatLevel(cl){
    if(!cl)return lbl("NotAvailableValue");

function stateColor(state){
    if(!state||state===lbl("NotAvailableValue"))return "#9ca3af";
    var s=String(state).toUpperCase();
    if(s==="ONLINE")return "#16a34a";
    if(s==="OFFLINE"||s==="RESTRICTED"||s==="RESTORING"||s==="RECOVERING"||s==="SUSPECT")return "#dc2626";
    return "#9ca3af";
}
function getDbReadinessStatus(db, platform){
    var isVM=platform==="SqlServerOnAzureVM";
    var tr=db.TargetReadinesses&&db.TargetReadinesses[platform];
    var status="Unknown";
    if(isVM){ status="Ready"; }
    else if(tr){ status=tr.RecommendationStatus; }
    var hasFindings=db.DatabaseAssessments&&db.DatabaseAssessments.some(function(a){return a.AppliesToMigrationTargetPlatform===platform;});
    if(status==="Ready"&&hasFindings)return "ReadyWithWarnings";

// Why a database was not assessed. RecommendationStatus is Unknown when the database carries errors
// or is not online, so the reason is read back from the same two inputs.
function notAssessedReason(db){
    var rs=db&&db.TargetReadinesses;
    if(rs){
        for(var k in rs){
            if(!rs.hasOwnProperty(k)||!rs[k])continue;
            var errs=rs[k].Errors;
            if(errs&&errs.length){
                var e=errs[0];
                var msg=e&&(e.Message||e.ErrorSummary);
                if(msg)return String(msg);
            }
        }
    }
    var state=(db.Properties&&db.Properties.DatabaseState)||"";
    if(state&&state!=="Online")return fmt(lbl("NotAssessedStateReason"),state);
    return lbl("NotAssessedGenericReason");
}
function dbStatusValues(){
    var seen={},out=[];
    (_server.Databases||[]).forEach(function(db){
        var s=(db.Properties&&db.Properties.DatabaseState)||"";
        if(s&&!seen[s]){ seen[s]=1; out.push(s); }
    });
    return out.sort();
}
function filteredDbs(){
    var s=(_dbPane.search||"").toLowerCase();
    return (_server.Databases||[]).filter(function(db){
        var props=db.Properties||{};
        if(s&&String(props.Name||"").toLowerCase().indexOf(s)===-1)return false;
        if(_dbPane.assessed!=="All"){
            var want=_dbPane.assessed==="Assessed";
            if(isDbAssessed(db)!==want)return false;
        }
        if(_dbPane.status!=="All"&&String(props.DatabaseState||"")!==_dbPane.status)return false;
        return true;
    });
}

function renderDbAssessedTable(){
    var all=filteredDbs();
    var pageCount=Math.max(1,Math.ceil(all.length/_dbPane.pageSize));
    if(_dbPane.page>pageCount)_dbPane.page=pageCount;
    var start=(_dbPane.page-1)*_dbPane.pageSize;
    var rows=all.slice(start,start+_dbPane.pageSize);

    var h='<table class="db-assessed-tbl"><thead><tr>';
    h+='<th>'+esc(lbl("DatabaseNameColumn"))+'</th><th>'+esc(lbl("AssessedStatusColumn"))+'</th><th>'+esc(lbl("StatusColumn"))+'</th><th>'+esc(lbl("DbSizeColumn"))+'</th><th>'+esc(lbl("CompatibilityLevelColumn"))+'</th>';
    h+='</tr></thead><tbody>';
    if(rows.length===0){
        h+='<tr><td colspan="5" style="text-align:center;color:#6b7280;padding:16px">'+esc(lbl("NoDatabasesFound"))+'</td></tr>';
    } else {
        rows.forEach(function(db){
            var props=db.Properties||{};
            var assessed=isDbAssessed(db);
            var state=props.DatabaseState||lbl("NotAvailableValue");
            var compat=parseCompatLevel(props.CompatibilityLevel);
            h+='<tr>';
            h+='<td class="db-name-cell" title="'+esc(props.Name||"")+'">'+esc(props.Name||lbl("NotAvailableValue"))+'</td>';
            if(assessed){
                h+='<td><span class="db-assessed">'+icOk()+' '+esc(lbl("AssessedLabel"))+'</span></td>';
            } else {
                var reason=fmt(lbl("NotAssessedReasonPrefix"),notAssessedReason(db));
                h+='<td><span class="db-not-assessed">'+icIss()+' '+esc(lbl("NotAssessedLabel"))+
                   '<span class="info-tip" tabindex="0" aria-label="'+esc(reason)+'">'+infoGlyph()+'<span class="info-tip-box">'+esc(reason)+'</span></span></span></td>';
            }
            h+='<td><span class="db-state-dot" style="background:'+stateColor(state)+'"></span> '+esc(state)+'</td>';
            h+='<td>'+esc(props.SizeMB!=null?String(Math.round(props.SizeMB)):lbl("NotAvailableValue"))+'</td>';
            h+='<td>'+esc(compat)+'</td>';
            h+='</tr>';
        });
    }
    h+='</tbody></table>';
    h+=renderDbPager(all.length,start,rows.length,pageCount);
    return h;
}
function renderDbPager(total,start,shown,pageCount){
    var from=total===0?0:start+1;
    var to=start+shown;
    var h='<div class="db-pager">';
    h+='<span class="db-pager-range">'+esc(fmt(lbl("PagerRange"),String(from),String(to),String(total)))+'</span>';
    h+='<span class="db-pager-pages">';
    h+='<button class="db-pager-nav" '+(_dbPane.page<=1?'disabled':'onclick="setDbPanePage('+(_dbPane.page-1)+')"')+' aria-label="'+esc(lbl("PagerPrevious"))+'">&#8249;</button>';
    // Window the page numbers so a long list does not overflow the pane.
    var first=Math.max(1,Math.min(_dbPane.page-2,pageCount-4));
    var last=Math.min(pageCount,first+4);
    for(var i=first;i<=last;i++){
        h+='<button class="db-pager-page'+(i===_dbPane.page?' active':'')+'" onclick="setDbPanePage('+i+')">'+i+'</button>';
    }
    h+='<button class="db-pager-nav" '+(_dbPane.page>=pageCount?'disabled':'onclick="setDbPanePage('+(_dbPane.page+1)+')"')+' aria-label="'+esc(lbl("PagerNext"))+'">&#8250;</button>';
    h+='</span></div>';
    return h;
}

var TARGET_ORDER = ["AzureSqlDatabase","AzureSqlManagedInstance","SqlServerOnAzureVM"];
// Help destinations offered when a target is not outright ready.
var CONTACT_MIGRATION_EXPERT_URL = "https://aka.ms/contactmigrationexpert";

function platByKey(k){ for(var i=0;i<PLATFORMS.length;i++){ if(PLATFORMS[i].key===k) return PLATFORMS[i]; } return null; }
// Card heading for a target, for example "Azure SQL Database (PaaS)". Both halves are localized
// resources, so the combined title is not restated here.
function targetTitle(k){
    var p=platByKey(k);
    if(!p) return k;
    var type=p.type?" ("+paasAbbrev(p.type)+")":"";
    return p.label+type;
}
// The resource spells the hosting model out ("Platform as a Service (PaaS)"); the card wants only
// the abbreviation, which is the part already in brackets.
function paasAbbrev(type){
    var m=/\(([^)]+)\)\s*$/.exec(type);
    return m?m[1]:type;
}

// The assessment supplies a Differentiators section describing the capability comparison. It keys
// platforms as AzureSqlVirtualMachine where the report uses SqlServerOnAzureVM, so map between them.
var DIFF_PLATFORM_KEYS = {
    AzureSqlDatabase:"AzureSqlDatabase",
    AzureSqlManagedInstance:"AzureSqlManagedInstance",
    SqlServerOnAzureVM:"AzureSqlVirtualMachine"
};
function differentiators(){ return (typeof reportDifferentiators!=="undefined" && reportDifferentiators) ? reportDifferentiators : null; }

// Capability groups come from the assessment's Differentiators section, which ships with the
// assessment package. There is no built-in copy: restating it here would let the two drift.
function featureGroups(){
    var d=differentiators();
    if(!d||!d.Capabilities||!d.Capabilities.length) return [];
    return d.Capabilities.map(function(cap){
        return {
            key:cap.Key,
            title:cap.DisplayName||cap.Key,
            learnMore:cap.LearnMoreUrl||"",
            rows:(cap.Facets||[]).map(function(f){ return { key:f.Key, label:f.DisplayName||f.Key, learnMore:f.LearnMoreUrl||"" }; })
        };
    });
}
function diffLookup(list,platformKey,valueField){
    var want=DIFF_PLATFORM_KEYS[platformKey]||platformKey;
    for(var i=0;i<(list||[]).length;i++){
        if(list[i].PlatformKey===want) return list[i][valueField];
    }
    return "";
}
// Rating for one capability on one target.
function featureRating(groupKey,platformKey){
    var d=differentiators();
    if(!d||!d.Capabilities) return "";
    for(var i=0;i<d.Capabilities.length;i++){
        if(d.Capabilities[i].Key===groupKey) return diffLookup(d.Capabilities[i].PlatformRatings,platformKey,"Rating")||"";
    }
    return "";
}
// Facet value for one capability row on one target.
function featureValue(groupKey,row,platformKey){
    var d=differentiators();
    if(!d||!d.Capabilities) return "";
    for(var i=0;i<d.Capabilities.length;i++){
        if(d.Capabilities[i].Key!==groupKey) continue;
        var facets=d.Capabilities[i].Facets||[];
        for(var j=0;j<facets.length;j++){
            if(facets[j].Key===row.key) return diffLookup(facets[j].PlatformValues,platformKey,"Value")||"";
        }
    }
    return "";
}
// A facet value is either a plain string or an ordered list of styled runs, because the assessment
// serializes multi-run content as an array (see TextContentJsonConverter). Both shapes end up here.
function runsHtml(v){
    if(v==null)return "";
    if(Object.prototype.toString.call(v)!=="[object Array]")return esc(v);
    return v.map(function(r){
        var t=esc(r&&r.Text!=null?r.Text:"");
        return (r&&r.Highlighted)?'<b>'+t+'</b>':t;
    }).join("");
}

// Findings rollup for a target: counts unique findings across the instance AND its
// databases, so the main page agrees with the "Readiness findings" tab.
function targetFindingCounts(server,platform){
    if(platform==="SqlServerOnAzureVM") return { issues:0, warnings:0 };
    var iss={},wrn={};
    function add(a){
        if(!a||a.AppliesToMigrationTargetPlatform!==platform)return;
        var fid=a.FeatureId||((a.RuleMetadata&&a.RuleMetadata.Description)||"\u2014");
        if(a.IssueCategory==="Warning")wrn[fid]=true;
        else if(isIssueType(a.IssueCategory))iss[fid]=true;
    }
    (server.ServerAssessments||[]).forEach(add);
    (server.Databases||[]).forEach(function(db){ (db.DatabaseAssessments||[]).forEach(add); });
    return { issues:Object.keys(iss).length, warnings:Object.keys(wrn).length };
}
// Per-target readiness rollup used by the readiness rows.
function targetReadiness(server,k){
    var isVM=(k==="SqlServerOnAzureVM");
    var fc=targetFindingCounts(server,k);
    var c=isVM
        ? { ready:(server.Databases||[]).filter(function(db){return isDbAssessed(db);}).length, warn:0, notReady:0 }
        : dbReadinessCounts(server.Databases,k);
    var status="ready";
    if(!isVM){
        var r=server.TargetReadinesses&&server.TargetReadinesses[k];
        var ready=r&&r.RecommendationStatus==="Ready";
        if(!ready||c.notReady>0||fc.issues>0) status="conditions";
    }
    return { status:status, issues:fc.issues, warnings:fc.warnings, counts:c };
}

// ── featured tier pane ─────────────────────────────────────────────────────
// Every value here comes from the assessment's ServiceTierComparison section, which ships with the
// assessment package. There is no built-in copy: restating it here would let the two drift.

// The assessment keys this section by platform, with its own spelling of the SQL Database key.
function tierComparison(){
    var t=(typeof reportTierComparison!=="undefined" && reportTierComparison) ? reportTierComparison : null;
    if(!t) return null;
    return t.AzureSQLDatabase||t.AzureSqlDatabase||null;
}
// The schema does not say which cells are advantages, so the featured column is marked on every
// dimension except purely descriptive ones. Remove this once the schema carries the flag.
var TIER_DESCRIPTIVE_KEYS = { BestFor:true };

// Normalizes the section into { title, intro, columns[], rows[], footnote }, or null when the
// assessment supplied none, in which case the caller omits the pane.
function tierModel(){
    var c=tierComparison();
    if(!c||!c.ServiceTiers||!c.ServiceTiers.length) return null;
    var featuredKey=(c.FeaturedTier&&c.FeaturedTier.ServiceTierKey)||"";
    var featuredLabel=(c.FeaturedTier&&c.FeaturedTier.Label)||"";
    var featuredIndex=-1;
    var columns=c.ServiceTiers.map(function(t,i){
        var name=t.DisplayName||t.Key;
        if(t.Key===featuredKey){ featuredIndex=i; return featuredLabel?name+" ("+featuredLabel+")":name; }
        return name;
    });
    var rows=(c.Capabilities||[]).map(function(d){
        return {
            feature:d.DisplayName||d.Key,
            check:!TIER_DESCRIPTIVE_KEYS[d.Key],
            values:c.ServiceTiers.map(function(t){ return (t.Values&&t.Values[d.Key])||""; })
        };
    });
    var footnote=((c.Footnotes||[]).map(function(f){ return (f.Marker||"")+" "+(f.Text||""); }).join(" ")).trim();
    return {
        title:(c.FeaturedTier&&c.FeaturedTier.Title)||"",
        intro:(c.FeaturedTier&&c.FeaturedTier.Description)||"",
        columns:columns,
        featuredIndex:featuredIndex,
        rows:rows,
        footnote:footnote
    };
}

function renderTierPaneContent(){
    var m=tierModel();
    if(!m) return "";
    var h='<div class="tp-hdr">'+icStar()+
        '<span class="tp-title">'+esc(m.title)+'</span>'+
        '<button class="tp-close" onclick="closeTierPane()" aria-label="'+esc(lbl("CloseButton"))+'">&#10005;</button></div>';
    h+='<div class="tp-body">';
    if(m.intro) h+='<p class="tp-intro">'+esc(m.intro)+'</p>';
    h+='<div class="tp-tablewrap"><div class="tp-topbar"></div>';
    h+='<table class="tp-table"><thead><tr><th>'+esc(lbl("FeatureColumn"))+'</th>';
    m.columns.forEach(function(c,i){ h+='<th'+(i===m.featuredIndex?' class="tp-feat"':'')+'>'+esc(c)+'</th>'; });
    h+='</tr></thead><tbody>';
    m.rows.forEach(function(r){
        h+='<tr><td class="tp-rowlbl">'+esc(r.feature)+'</td>';
        r.values.forEach(function(v,i){
            if(i===m.featuredIndex){
                var mark=r.check?icOk():'';
                h+='<td class="tp-feat"><div class="tp-feat-inner">'+mark+'<span class="tp-val">'+esc(v)+'</span></div></td>';
            } else {
                // The trailing column is de-emphasised so the featured tier reads as the focus.
                var cls=(i>m.featuredIndex)?'tp-muted':'';
                h+='<td class="'+cls+'">'+esc(v)+'</td>';
            }
        });
        h+='</tr>';
    });
    h+='</tbody></table>';
    if(m.footnote) h+='<div class="tp-foot"><span class="mt-info">'+infoGlyph()+'</span> <span>'+esc(m.footnote)+'</span></div>';
    h+='</div></div>';
    return h;
}
function ensureTierPane(){
    if(document.getElementById("tier-pane")) return;
    var ov=document.createElement("div");
    ov.id="tier-pane-overlay";
    ov.className="finding-pane-overlay";
    ov.onclick=closeTierPane;
    ov.style.display="none";
    document.body.appendChild(ov);
    var pn=document.createElement("div");
    pn.id="tier-pane";
    pn.className="tier-pane";
    pn.style.display="none";
    document.body.appendChild(pn);
}
function openTierPane(){
    ensureTierPane();
    var pane=document.getElementById("tier-pane");
    var overlay=document.getElementById("tier-pane-overlay");
    if(!pane||!overlay)return;
    pane.innerHTML=renderTierPaneContent();
    pane.style.display="block";
    overlay.style.display="block";
    document.body.style.overflow="hidden";
}
function closeTierPane(){
    var pane=document.getElementById("tier-pane");
    var overlay=document.getElementById("tier-pane-overlay");
    if(pane)pane.style.display="none";
    if(overlay)overlay.style.display="none";
    // Only release the page scroll when no other pane is still open.
    var other=document.getElementById("finding-pane");
    if(!other||other.style.display==="none")document.body.style.overflow="";
}

// The engine publishes a justification per recommendation, and they are shown at target level only
// where the target is a single resource. Azure SQL Database is a recommendation per database, so it
// has no single reason for the target and the section is not rendered for it at all; its reasons are
// shown per row in the per database pane instead.
function targetJustifications(platform){
    var pd=pricingModel();

    var groups=targetConfigGroups(rec,platform).filter(function(g){ return g.justifications&&g.justifications.length; });
    if(groups.length===0) return [];
    return groups[0].justifications.filter(function(j){
        return groups.every(function(g){ return g.justifications.indexOf(j)!==-1; });
    });
}
function renderRecommendationReason(platform){

    // target. Its reasons are shown per row in the per database pane instead, and the section is

// when the engine did not publish one for that commitment term.
function groupComputeCost(g,basis){
    if(!g) return null;
    var real=commitmentPrice(g,basis);
    if(real!=null) return real;
    return basis.field?null:g.computeCost;
}
// The engine returns one SkuRecommendationResult per database for Azure SQL DB, but Managed Instance
// and SQL VM produce a single instance-level result with no group breakdown. When a `groups` array is
// present we render one card per group; otherwise we render a single card from the aggregate, which
// covers every assessed database.
function targetConfigGroups(rec,platform){
    if(rec&&rec.groups&&rec.groups.length) return rec.groups;
    if(!rec) return [];
    return [{
        name:(platform==="AzureSqlDatabase"?"Recommendation for all databases":"Recommended instance"),
        compute:(rec.serviceTier||"\u2014")+(rec.vCores!=null?", "+rec.vCores+" vCores":""),
        storageGb:rec.storageGb,
        computeCost:rec.computeCost,
        storageCost:rec.storageCost
    }];

    var h=renderRecommendationReason(platform);

// ── per database recommendation pane ──────────────────────────────────────
// Azure SQL Database is sized per database, so the single card opens this pane to show what the
// engine recommended for each one, together with the justification it published.
var _pdPane={ gi:0, search:"", page:1, pageSize:10, filters:{ready:true,readyWithWarnings:true,notReady:true}, pending:null, ddOpen:false };

function ensurePerDatabasePane(){
    if(document.getElementById("pd-pane"))return;

    ov.id="pd-overlay"; ov.className="finding-pane-overlay";
    ov.style.display="none"; ov.style.zIndex="400"; ov.onclick=closePerDatabasePane;
    document.body.appendChild(ov);
    var pn=document.createElement("div");
    pn.id="pd-pane"; pn.className="finding-pane pd-pane-wide";
    pn.style.display="none"; pn.style.zIndex="401";
    document.body.appendChild(pn);
}
function openPerDatabasePane(gi){
    ensurePerDatabasePane();
    var pane=document.getElementById("pd-pane"), overlay=document.getElementById("pd-overlay");
    if(!pane||!overlay)return;
    _pdPane={ gi:gi||0, search:"", page:1, pageSize:10, filters:{ready:true,readyWithWarnings:true,notReady:true}, pending:null, ddOpen:false, selected:null };
    pane.innerHTML=renderPerDatabasePane();

}
function closePerDatabasePane(){
    var pane=document.getElementById("pd-pane"), overlay=document.getElementById("pd-overlay");
    if(pane)pane.style.display="none";
    if(overlay)overlay.style.display="none";
}
// The databases a card covers, resolved to the assessed records so the table can show readiness and
// size. A card with no name list is instance level and covers every assessed database.
function cardDatabases(g){
    var byName={};
    (_server.Databases||[]).forEach(function(db){ var n=(db.Properties&&db.Properties.Name)||""; if(n)byName[n]=db; });
    if(!g||!g.databaseNames) return (_server.Databases||[]).filter(function(db){ return isDbAssessed(db); });
    var out=[];
    g.databaseNames.forEach(function(n){ if(byName[n])out.push(byName[n]); else out.push({ Properties:{ Name:n } }); });
    return out;
}
function perDatabaseCard(){
    var pd=pricingModel();
    var rec=pd&&pd.recommendations?pd.recommendations[_activePlatform]:null;
    return targetConfigGroups(rec,_activePlatform)[_pdPane.gi]||null;
}
function perDatabaseRows(){
    var rows=cardDatabases(perDatabaseCard());
    if(_pdPane.search){
        var s=_pdPane.search.toLowerCase();
        rows=rows.filter(function(db){ return String((db.Properties&&db.Properties.Name)||"").toLowerCase().indexOf(s)!==-1; });
    }
    var f=_pdPane.filters;
    return rows.filter(function(db){
        var st=getDbReadinessStatus(db,_activePlatform);
        if(st==="Ready")return f.ready;
        if(st==="ReadyWithWarnings")return f.readyWithWarnings;
        return f.notReady;
    });
}
function setPerDatabaseSearch(v){ _pdPane.search=v; _pdPane.page=1; refreshPerDatabasePane(); }
// Clicking a row scopes the reason section below the table to that database.
function selectPerDatabaseRow(name){ _pdPane.selected=name||null; refreshPerDatabasePane(); }
function perDatabaseGoPage(p){ _pdPane.page=p; refreshPerDatabasePane(); }
function togglePerDatabaseDD(){
    _pdPane.ddOpen=!_pdPane.ddOpen;
    if(_pdPane.ddOpen)_pdPane.pending={ready:_pdPane.filters.ready,readyWithWarnings:_pdPane.filters.readyWithWarnings,notReady:_pdPane.filters.notReady};
    refreshPerDatabasePane();
}
function cancelPerDatabaseDD(){ _pdPane.ddOpen=false; refreshPerDatabasePane(); }
function applyPerDatabaseDD(){
    var p=_pdPane.pending||_pdPane.filters;
    _pdPane.filters={ready:p.ready,readyWithWarnings:p.readyWithWarnings,notReady:p.notReady};

function togglePerDatabasePendingAll(c){ _pdPane.pending={ready:c,readyWithWarnings:c,notReady:c}; refreshPerDatabasePane(); }
function togglePerDatabasePending(k,c){
    if(!_pdPane.pending)_pdPane.pending={ready:_pdPane.filters.ready,readyWithWarnings:_pdPane.filters.readyWithWarnings,notReady:_pdPane.filters.notReady};
    _pdPane.pending[k]=c; refreshPerDatabasePane();

function togglePerDatabasePendingReady(c){ togglePerDatabasePending("ready",c); }
// One visible option, two underlying statuses, so both move together.
function togglePerDatabasePendingConditions(c){
    if(!_pdPane.pending)_pdPane.pending={ready:_pdPane.filters.ready,readyWithWarnings:_pdPane.filters.readyWithWarnings,notReady:_pdPane.filters.notReady};
    _pdPane.pending.readyWithWarnings=c;
    _pdPane.pending.notReady=c;
    refreshPerDatabasePane();
}
function refreshPerDatabasePane(){
    var pane=document.getElementById("pd-pane");
    if(!pane)return;
    // Re-rendering the whole pane replaces the search box, so a plain innerHTML swap drops focus
    // on every keystroke. The other filters re-render only their table, which is why they behave.
    // Remember the caret and restore it once the new markup is in place.
    var active=document.activeElement;
    var inSearch=!!(active&&active.classList&&active.classList.contains("filter-search")&&pane.contains(active));
    var caret=inSearch?active.selectionStart:null;
    pane.innerHTML=renderPerDatabasePane();
    if(inSearch){
        var box=pane.querySelector("input.filter-search");
        if(box){
            box.focus();
            if(caret!=null)box.setSelectionRange(caret,caret);
        }
    }
}
// The engine's recommendation for one named database, carried on the card that covers them all.
// Absent for an instance level target, whose databases share a single recommendation.
function databaseDetail(g,name){
    if(!g||!g.databaseDetails||!name) return null;
    for(var i=0;i<g.databaseDetails.length;i++){
        if(g.databaseDetails[i]&&g.databaseDetails[i].name===name) return g.databaseDetails[i];
    }
    return null;
}
// A database's monthly cost under the selected basis. Compute follows the basis where the engine
// published a commitment price; storage is not discounted by reservations, so it is added as is.
function databaseMonthlyCost(d,basis){
    if(!d) return null;
    var compute=groupComputeCost(d,basis);
    if(compute==null) return null;
    return compute+(d.storageCost||0);
}

// ── filter helpers ─────────────────────────────────────────────────────────
function filterInstFindings(){
    return _instFindings.filter(function(e){
        var c=e.IssueCategory||"";
        if(isIssueType(c)&&!_instFilter.showIssues)return false;
        if(c==="Warning"&&!_instFilter.showWarnings)return false;
        if(_instFilter.search){var d=findingDesc(e,_activePlatform); if(d.toLowerCase().indexOf(_instFilter.search.toLowerCase())===-1)return false;}
        return true;
    });
}
function filterDbFindings(){
    return _dbFindings.filter(function(e){
        var c=e.a.IssueCategory||"";
        if(isIssueType(c)&&!_dbFilter.showIssues)return false;
        if(c==="Warning"&&!_dbFilter.showWarnings)return false;
        if(_dbFilter.selectedDbs.length>0&&_dbFilter.selectedDbs.indexOf(e.dbName)===-1)return false;
        if(_dbFilter.search){var d=findingDesc(e.a,_activePlatform); if(d.toLowerCase().indexOf(_dbFilter.search.toLowerCase())===-1)return false;}
        return true;
    });
}

// ── findings table ─────────────────────────────────────────────────────────
function groupDbFindings(rows){
    var map={}, order=[];
    rows.forEach(function(entry){
        var a=entry.a;
        var fid=a.FeatureId||((a.RuleMetadata&&a.RuleMetadata.Description)||"—");
        if(!map[fid]){
            map[fid]={fid:fid,a:a,impacted:0,dbs:{}};
            order.push(fid);
        }
        map[fid].impacted+=(a.ImpactedObjects?a.ImpactedObjects.length:0);
        if(entry.dbName)map[fid].dbs[entry.dbName]=true;
    });
    return order.map(function(fid){return map[fid];});
}
function renderPagination(totalItems,currentPage,pageSize,goFnName){
    var totalPages=Math.max(1,Math.ceil(totalItems/pageSize));
    if(totalItems<=pageSize)return "";
    var start=(currentPage-1)*pageSize+1;
    var end=Math.min(totalItems,currentPage*pageSize);
    var h='<div class="pg-bar"><span class="pg-range">'+start+'-'+end+' of '+totalItems+'.</span><span class="pg-nums">';
    h+='<button class="pg-arrow" onclick="'+goFnName+'('+(currentPage-1)+')"'+(currentPage<=1?' disabled':'')+'>&#8249;</button>';
    var first=Math.max(1,Math.min(currentPage-2,totalPages-4));
    var last=Math.min(totalPages,first+4);
    for(var p=first;p<=last;p++){
        h+='<button class="pg-num'+(p===currentPage?" cur":"")+'" onclick="'+goFnName+'('+p+')">'+p+'</button>';
    }
    h+='<button class="pg-arrow" onclick="'+goFnName+'('+(currentPage+1)+')"'+(currentPage>=totalPages?' disabled':'')+'>&#8250;</button>';
    h+='</span></div>';
    return h;
}
function groupByDatabases(rows){
    var map={}, order=[];
    rows.forEach(function(entry){
        var db=entry.dbName||lbl("NotAvailableValue");
        if(!map[db]){map[db]={dbName:db,issues:0,warnings:0,impacted:0}; order.push(db);}
        var c=entry.a.IssueCategory||"";
        if(isIssueType(c))map[db].issues++; else map[db].warnings++;
        map[db].impacted+=(entry.a.ImpactedObjects?entry.a.ImpactedObjects.length:0);
    });
    return order.map(function(db){return map[db];});
}
function renderFindingsTable(rows,isInst){
    if(rows.length===0)return '<p class="no-findings">'+esc(fmt(lbl("NoCompatibilityFindings"), lbl(isInst?"CompatibilityScopeInstance":"CompatibilityScopeDatabase")))+'</p>';
    var sec=isInst?"inst":"db";
    if(!isInst&&_dbGroupBy==="databases"){
        var dbRows=groupByDatabases(rows);
        var totalItems=dbRows.length;
        var totalPages=Math.max(1,Math.ceil(totalItems/_findingsPageSize));
        if(_findingsPage[sec]>totalPages)_findingsPage[sec]=totalPages;
        var start=(_findingsPage[sec]-1)*_findingsPageSize;
        var pageItems=dbRows.slice(start,start+_findingsPageSize);
        var h='<div class="findings-tbl-wrap"><table class="findings-tbl"><thead><tr><th>'+esc(lbl("DatabaseNameColumn"))+'</th><th>'+esc(lbl("CompatibilityBlockingIssuesLabel"))+'</th><th>'+esc(lbl("CompatibilityWarningsLabel"))+'</th><th>'+esc(lbl("ImpactedObjectsColumn"))+'</th></tr></thead><tbody>';
        pageItems.forEach(function(g){
            h+='<tr class="finding-row"><td><a href="javascript:void(0)" class="fp-learn-link" onclick="openDbDetailPane(\''+jsq(g.dbName)+'\')">'+esc(g.dbName)+'</a></td><td>'+g.issues+'</td><td>'+g.warnings+'</td><td>'+g.impacted+'</td></tr>';
        });
        h+='</tbody></table></div>';
        h+=renderPagination(totalItems,_findingsPage[sec],_findingsPageSize,'findingsGoPage_'+sec);
        return h;
    }
    var allRows=isInst?rows:groupDbFindings(rows);
    var totalItems=allRows.length;
    var totalPages=Math.max(1,Math.ceil(totalItems/_findingsPageSize));
    if(_findingsPage[sec]>totalPages)_findingsPage[sec]=totalPages;
    var start=(_findingsPage[sec]-1)*_findingsPageSize;
    var pageItems=allRows.slice(start,start+_findingsPageSize);
    var h='<div class="findings-tbl-wrap"><table class="findings-tbl"><thead><tr><th style="width:50%">'+esc(lbl("FindingsColumn"))+'</th><th>'+esc(lbl("TypeLabel"))+'</th><th>'+esc(lbl("ImpactedObjectsColumn"))+'</th>';
    if(!isInst)h+='<th>'+esc(lbl("UserDatabasesColumn"))+'</th>';
    h+='</tr></thead><tbody>';
    if(isInst){
        pageItems.forEach(function(a){
            var c=a.IssueCategory||"";
            var isBlock=isIssueType(c);
            var icon=isBlock?"":icTri();
            var desc=findingDesc(a,_activePlatform);
            var typeBadge=isBlock?'<span class="type-text blocker">'+esc(lbl("BlockingIssueLabel"))+'</span>':'<span class="type-text warning">'+esc(lbl("WarningLabel"))+'</span>';
            var impCnt=a.ImpactedObjects?a.ImpactedObjects.length:0;
            var fid=a.FeatureId||"";
            h+='<tr class="finding-row" onclick="openFindingPane(\''+jsq(fid)+'\',\''+jsq(c)+'\',true)"><td>'+icon+' <a class="finding-title" href="javascript:void(0)">'+esc(desc)+'</a></td><td>'+typeBadge+'</td><td>'+impCnt+'</td></tr>';
        });
    } else {
        pageItems.forEach(function(g){
            var a=g.a, c=a.IssueCategory||"";
            var isBlock=isIssueType(c);
            var icon=isBlock?"":icTri();
            var desc=findingDesc(a,_activePlatform);
            var typeBadge=isBlock?'<span class="type-text blocker">'+esc(lbl("BlockingIssueLabel"))+'</span>':'<span class="type-text warning">'+esc(lbl("WarningLabel"))+'</span>';
            var dbCount=Object.keys(g.dbs).length;
            var fid=a.FeatureId||g.fid||"";
            h+='<tr class="finding-row" onclick="openFindingPane(\''+jsq(fid)+'\',\''+jsq(c)+'\',false)"><td>'+icon+' <a class="finding-title" href="javascript:void(0)">'+esc(desc)+'</a></td><td>'+typeBadge+'</td><td>'+g.impacted+'</td><td>'+dbCount+'</td></tr>';
        });
    }
    h+='</tbody></table></div>';
    h+=renderPagination(totalItems,_findingsPage[sec],_findingsPageSize,'findingsGoPage_'+sec);
    return h;
}
function findingsGoPage_inst(p){
    var totalPages=Math.max(1,Math.ceil(filterInstFindings().length/_findingsPageSize));
    if(p<1||p>totalPages)return;
    _findingsPage.inst=p;
    document.getElementById("tbl-inst").innerHTML=renderFindingsTable(filterInstFindings(),true);
}
function findingsGoPage_db(p){
    var filtered=filterDbFindings();
    var total=_dbGroupBy==="databases"?groupByDatabases(filtered).length:groupDbFindings(filtered).length;
    var totalPages=Math.max(1,Math.ceil(total/_findingsPageSize));
    if(p<1||p>totalPages)return;
    _findingsPage.db=p;
    document.getElementById("tbl-db").innerHTML=renderFindingsTable(filtered,false);
}

// ── compat block ───────────────────────────────────────────────────────────
function countUniqueFindings(rows,isInst){
    var warnIds={}, blockerIds={};
    rows.forEach(function(e){
        var a=isInst?e:e.a;
        var fid=a.FeatureId||((a.RuleMetadata&&a.RuleMetadata.Description)||"\u2014");
        if(a.IssueCategory==="Warning") warnIds[fid]=true;
        else if(isIssueType(a.IssueCategory)) blockerIds[fid]=true;
    });
    return{warns:Object.keys(warnIds).length, blockers:Object.keys(blockerIds).length};
}
function renderCompatBlock(title,isInst){
    var filtered=isInst?filterInstFindings():filterDbFindings();
    var counts=countUniqueFindings(filtered,isInst);
    var fid=isInst?"inst":"db";
    var collapsed=_compat[fid]===true;
    var h='<div class="compat-block" id="compat-block-'+fid+'">';
    h+='<div class="compat-hdr" onclick="toggleCompat(\''+fid+'\')"><span class="compat-arr">'+(collapsed?'&#9654;':'&#9660;')+'</span> '+esc(title)+'</div>';
    if(!collapsed){
        h+='<div class="compat-body">';
        h+='<div class="compat-sub">'+esc(lbl("IssuesPrefixLabel"))+icIss()+' <strong>'+counts.blockers+'</strong> &nbsp;|&nbsp; '+esc(lbl("WarningsPrefixLabel"))+icTri()+' <strong>'+counts.warns+'</strong></div>';
        h+=renderFilterBar(isInst);
        h+='<div id="tbl-'+fid+'">'+renderFindingsTable(isInst?filterInstFindings():filterDbFindings(),isInst)+'</div>';
        h+='</div>';
    }
    h+='</div>';
    return h;
}

function toggleCompat(fid){
    if(_openDD&&_openDD.section===fid) cancelDD();
    _compat[fid]=!(_compat[fid]||false);
    var blk=document.getElementById("compat-block-"+fid);
    if(!blk)return;
    var body=blk.querySelector(".compat-body");
    var arr =blk.querySelector(".compat-arr");
    if(body)body.style.display=_compat[fid]?"none":"";
    if(arr) arr.innerHTML   =_compat[fid]?"&#9654;":"&#9660;";
}

// ── filter bar with pill dropdowns ─────────────────────────────────────────
function renderFilterBar(isInst){
    var sec=isInst?"inst":"db";
    var sf=isInst?_instFilter:_dbFilter;
    var typeOpen=_openDD&&_openDD.section===sec&&_openDD.kind==="type";
    var dbOpen  =!isInst&&_openDD&&_openDD.section==="db"&&_openDD.kind==="db";
    var typeLbl =typePillLabel(sf.showIssues,sf.showWarnings);
    var dbLbl   =isInst?"":(dbPillLabel(_dbFilter.selectedDbs));
    var srchVal =esc(sf.search);

    var h='<div class="filter-bar">';

    // search
    h+='<div class="filter-search-wrap">';
    h+='<span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>';
    h+='<input type="text" class="filter-search" style="width:260px" placeholder="'+esc(lbl("FilterSearchPlaceholder"))+'" value="'+srchVal+'" oninput="setSearch(\''+sec+'\',this.value)">';
    if(sf.search)h+='<button class="clr-btn" onclick="setSearch(\''+sec+'\',\'\');document.querySelector(\'#compat-block-'+sec+' .filter-search\').value=\'\'">&#10005;</button>';
    h+='</div>';

    // group by pill (only for DB compat)
    if(!isInst){
        var gbOpen=_openDD&&_openDD.section==="db"&&_openDD.kind==="groupby";
        var gbLbl=lbl(_dbGroupBy==="findings"?"GroupByFindings":"GroupByDatabases");
        h+='<div class="filter-pill-wrap">';
        h+='<button class="filter-pill'+(gbOpen?" active":"")+'" onclick="toggleDD(\'db\',\'groupby\')">'+esc(gbLbl)+'</button>';
        if(gbOpen) h+=renderGroupByDropdown();
        h+='</div>';
    }

    // type pill
    h+='<div class="filter-pill-wrap">';
    h+='<button class="filter-pill'+(typeOpen?" active":"")+'" onclick="toggleDD(\''+sec+'\',\'type\')">'+esc(typeLbl)+'</button>';
    if(typeOpen) h+=renderTypeDropdown(sec);
    h+='</div>';

    // db pill (only for DB compat)
    if(!isInst&&_dbNames.length>0){
        h+='<div class="filter-pill-wrap">';
        h+='<button class="filter-pill'+(dbOpen?" active":"")+'" onclick="toggleDD(\'db\',\'db\')">'+esc(dbLbl)+'</button>';
        if(dbOpen) h+=renderDbDropdown();
        h+='</div>';
    }

    h+='</div>';
    return h;
}

function renderTypeDropdown(sec){
    var allChk = sec==="inst"?(_pending.instIssues&&_pending.instWarnings):(_pending.dbIssues&&_pending.dbWarnings);
    var issChk = sec==="inst"?_pending.instIssues:_pending.dbIssues;
    var wrnChk = sec==="inst"?_pending.instWarnings:_pending.dbWarnings;
    var chk=function(v){return v?" checked":"";}
    var h='<div class="dd-backdrop" onclick="cancelDD()"></div>';
    h+='<div class="dd-panel"><div class="dd-panel-title">'+esc(lbl("TypeFilterPanelTitle"))+'</div><div class="dd-val-label">'+esc(lbl("FilterValueLabel"))+'</div>';
    h+='<div class="dd-items">';
    h+='<div class="dd-item"><input type="checkbox"'+chk(allChk)+' onchange="togglePendingAll(\''+sec+'\',this.checked)"> '+esc(lbl("AllLabel"))+'</div>';
    h+='<div class="dd-item"><input type="checkbox"'+chk(issChk)+' onchange="togglePendingType(\''+sec+'\',\'issues\',this.checked)"> '+esc(lbl("BlockingIssueLabel"))+'</div>';
    h+='<div class="dd-item"><input type="checkbox"'+chk(wrnChk)+' onchange="togglePendingType(\''+sec+'\',\'warnings\',this.checked)"> '+esc(lbl("WarningLabel"))+'</div>';
    h+='</div>';
    h+='<div class="dd-actions"><button class="dd-btn-apply" onclick="applyDD()">'+esc(lbl("ApplyButton"))+'</button><button class="dd-btn-cancel" onclick="cancelDD()">'+esc(lbl("CancelButton"))+'</button></div>';
    h+='</div>';
    return h;
}

function renderDbDropdown(){
    var selAll=_dbNames.length>0&&_pending.dbNames.length===_dbNames.length;
    var chk=function(v){return v?" checked":"";}
    var valSearch=_pending.dbValSearch||"";
    var visibleDbs=_dbNames.filter(function(n){return!valSearch||n.toLowerCase().indexOf(valSearch.toLowerCase())!==-1;});
    var h='<div class="dd-backdrop" onclick="cancelDD()"></div>';
    h+='<div class="dd-panel"><div class="dd-panel-title">'+esc(lbl("DatabaseFilterPanelTitle"))+'</div><div class="dd-val-label">'+esc(lbl("FilterValueLabel"))+'</div>';
    h+='<div class="dd-search-wrap"><span class="dd-search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>';
    h+='<input type="text" class="dd-search" placeholder="'+esc(lbl("SearchValuesPlaceholder"))+'" value="'+esc(valSearch)+'" oninput="setPendingDbValSearch(this.value)"></div>';
    h+='<div class="dd-items">';
    if(!valSearch)h+='<div class="dd-item"><input type="checkbox"'+chk(selAll)+' onchange="togglePendingDbAll(this.checked)"> '+esc(lbl("AllLabel"))+'</div>';
    visibleDbs.forEach(function(n){
        var isSel=_pending.dbNames.indexOf(n)!==-1;
        h+='<div class="dd-item"><input type="checkbox"'+chk(isSel)+' onchange="togglePendingDbName(\''+jsq(n)+'\',this.checked)"> '+esc(n)+'</div>';
    });
    h+='</div>';
    h+='<div class="dd-actions"><button class="dd-btn-apply" onclick="applyDD()">'+esc(lbl("ApplyButton"))+'</button><button class="dd-btn-cancel" onclick="cancelDD()">'+esc(lbl("CancelButton"))+'</button></div>';
    h+='</div>';
    return h;
}
function renderGroupByDropdown(){
    var h='<div class="dd-backdrop" onclick="cancelDD()"></div>';
    h+='<div class="dd-panel"><div class="dd-panel-title">'+esc(lbl("GroupByLabel"))+'</div>';
    h+='<div class="dd-items">';
    h+='<div class="dd-item'+ (_dbGroupBy==="findings"?" dd-item-selected":"") +'" onclick="setDbGroupBy(\'findings\')" style="cursor:pointer;padding:6px 12px">'+esc(lbl("FindingsColumn"))+'</div>';
    h+='<div class="dd-item'+ (_dbGroupBy==="databases"?" dd-item-selected":"") +'" onclick="setDbGroupBy(\'databases\')" style="cursor:pointer;padding:6px 12px">'+esc(lbl("DatabasesOption"))+'</div>';
    h+='</div></div>';
    return h;
}
function setDbGroupBy(mode){
    _dbGroupBy=mode;
    _openDD=null;
    _findingsPage.db=1;
    rerenderFilterBar("db");
    document.getElementById("tbl-db").innerHTML=renderFindingsTable(filterDbFindings(),false);
    rerenderCompatSub("db");
}
function toggleDD(section, kind){
    var wasOpen=_openDD&&_openDD.section===section&&_openDD.kind===kind;
    if(wasOpen){ _openDD=null; rerenderFilterBar(section); return; }
    _pending={
        instIssues:_instFilter.showIssues, instWarnings:_instFilter.showWarnings,
        dbIssues:_dbFilter.showIssues,     dbWarnings:_dbFilter.showWarnings,
        dbNames:_dbFilter.selectedDbs.length>0?_dbFilter.selectedDbs.slice():_dbNames.slice(), dbValSearch:""
    };
    _openDD={section:section,kind:kind};
    rerenderFilterBar(section);
    if(!wasOpen&&section!=="inst"&&kind==="db") rerenderFilterBar("db");
}
function cancelDD(){
    var sec=_openDD?_openDD.section:null;
    _openDD=null;
    if(sec)rerenderFilterBar(sec);
}
function applyDD(){
    if(!_openDD)return;
    var sec=_openDD.section, knd=_openDD.kind;
    if(knd==="type"){
        if(sec==="inst"){ _instFilter.showIssues=_pending.instIssues; _instFilter.showWarnings=_pending.instWarnings; }
        else            { _dbFilter.showIssues=_pending.dbIssues;     _dbFilter.showWarnings=_pending.dbWarnings; }
    } else {
        _dbFilter.selectedDbs=_pending.dbNames.length===_dbNames.length?[]:_pending.dbNames.slice();
    }
    _openDD=null;
    _findingsPage[sec]=1;
    rerenderFilterBar(sec);
    if(sec==="inst"){ document.getElementById("tbl-inst").innerHTML=renderFindingsTable(filterInstFindings(),true);  rerenderCompatSub("inst"); }
    else            { document.getElementById("tbl-db").innerHTML  =renderFindingsTable(filterDbFindings(),false); rerenderCompatSub("db"); }
}
function togglePendingAll(sec,checked){
    if(sec==="inst"){ _pending.instIssues=checked; _pending.instWarnings=checked; }
    else            { _pending.dbIssues=checked;   _pending.dbWarnings=checked; }
    rerenderDDContent(sec);
}
function togglePendingType(sec,type,checked){
    if(sec==="inst"){ if(type==="issues")_pending.instIssues=checked; else _pending.instWarnings=checked; }
    else            { if(type==="issues")_pending.dbIssues=checked;   else _pending.dbWarnings=checked; }
    rerenderDDContent(sec);
}
function togglePendingDbAll(checked){
    _pending.dbNames=checked?_dbNames.slice():[];
    rerenderDDContent("db");
}
function togglePendingDbName(name,checked){
    if(checked){ if(_pending.dbNames.indexOf(name)===-1)_pending.dbNames.push(name); }
    else        { _pending.dbNames=_pending.dbNames.filter(function(d){return d!==name;}); }
    rerenderDDContent("db");
}
function setPendingDbValSearch(val){
    _pending.dbValSearch=val;
    rerenderDDContent("db");
}

// re-render helpers
function rerenderCompatSub(sec){
    var isInst=sec==="inst";
    var el=document.getElementById("compat-block-"+sec);
    if(!el)return;
    var counts=countUniqueFindings(isInst?filterInstFindings():filterDbFindings(),isInst);
    var sub=el.querySelector(".compat-sub");
    if(sub)sub.innerHTML=esc(lbl("CompatibilityWarningsLabel"))+": <strong>"+counts.warns+"</strong> &nbsp;|&nbsp; "+esc(lbl("CompatibilityBlockingIssuesLabel"))+": <strong>"+counts.blockers+"</strong>";
    var iconSpan=el.querySelector(".compat-status-icon");
    if(iconSpan)iconSpan.innerHTML=compatIcon(counts);
}
function rerenderFilterBar(sec){
    var isInst=sec==="inst";
    var el=document.getElementById("compat-block-"+sec);
    if(!el)return;
    var fb=el.querySelector(".filter-bar");
    if(fb){ var tmp=document.createElement("div"); tmp.innerHTML=renderFilterBar(isInst); fb.parentNode.replaceChild(tmp.firstChild,fb); }
}
function rerenderDDContent(sec){
    if(!_openDD||_openDD.section!==sec)return;
    var isInst=sec==="inst";
    var el=document.getElementById("compat-block-"+sec);
    if(!el)return;
    var panel=el.querySelector(".dd-panel");
    if(panel){
        // The database dropdown's own search box lives inside this panel, so replacing the panel
        // while the reader is typing destroys the input they are typing into. Carry the caret over
        // to the replacement, the same way the per database pane does.
        var active=document.activeElement;
        var inSearch=!!(active&&active.classList&&active.classList.contains("dd-search")&&panel.contains(active));
        var caret=inSearch?active.selectionStart:null;
        var tmp=document.createElement("div");
        tmp.innerHTML=_openDD.kind==="type"?renderTypeDropdown(sec):renderDbDropdown();
        var newPanel=tmp.querySelector(".dd-panel");
        if(newPanel){
            panel.parentNode.replaceChild(newPanel,panel);
            if(inSearch){
                var box=newPanel.querySelector("input.dd-search");
                if(box){
                    box.focus();
                    if(caret!=null)box.setSelectionRange(caret,caret);
                }
            }
        }
    }
}

// search
function setSearch(sec,val){
    _findingsPage[sec]=1;
    if(sec==="inst"){ _instFilter.search=val; document.getElementById("tbl-inst").innerHTML=renderFindingsTable(filterInstFindings(),true);  rerenderCompatSub("inst"); }
    else            { _dbFilter.search=val;   document.getElementById("tbl-db").innerHTML  =renderFindingsTable(filterDbFindings(),false); rerenderCompatSub("db"); }
}

// ── platform switch ────────────────────────────────────────────────────────
function switchPlatform(platform){
    _activePlatform=platform;
    var cards=document.querySelectorAll(".tgt-card[data-key]");
    for(var i=0;i<cards.length;i++) cards[i].classList.toggle("selected",cards[i].getAttribute("data-key")===platform);
}

// ── entry point ────────────────────────────────────────────────────────────
function renderReport(){
    var c=document.getElementById("report-container");
    if(!c)return;
    var servers=Array.isArray(reportData)?reportData:[];
    if(!servers.length){
        var errors=Array.isArray(reportErrors)?reportErrors:[];
        if(errors.length){
            var h='<div class="sec-card"><div class="sec-title">'+esc(lbl("AssessmentErrorsTitle"))+'</div>';
            errors.forEach(function(e){
                h+='<div style="border:1px solid #fca5a5;border-radius:6px;padding:14px 16px;margin-bottom:12px;background:#fff5f5">';
                h+='<div style="font-weight:600;color:#991b1b;margin-bottom:6px">'+esc(e.ErrorSummary||e.ErrorID||lbl("ErrorLabel"))+'</div>';
                if(e.Message)h+='<div style="font-size:.8rem;color:#1f2937;margin-top:4px"><span style="font-weight:600">'+esc(lbl("ImpactedObjectDescriptionColumn"))+': </span>'+esc(e.Message)+'</div>';
                if(e.PossibleCauses)h+='<div style="font-size:.8rem;color:#1f2937;margin-top:4px"><span style="font-weight:600">'+esc(lbl("PossibleCausesLabel"))+': </span>'+esc(e.PossibleCauses)+'</div>';
                if(e.Guidance)h+='<div style="font-size:.8rem;color:#1f2937;margin-top:4px"><span style="font-weight:600">'+esc(lbl("RecommendationLabel"))+': </span>'+esc(e.Guidance)+'</div>';
                h+='</div>';
            });
            h+='</div>';
            c.innerHTML=h;
        } else {
            c.innerHTML='<div class="alert-warning">'+esc(lbl("NoAssessmentData"))+'</div>';
        }
        return;
    }
    _server=servers[0];
    _activePlatform=recommendedKey(_server);
    captureHeaderSub();
    c.innerHTML=renderSourceInstance(_server)+renderTargetCards(_server)+renderAssessmentDetails(_server);
    if(!document.getElementById("finding-pane")){
        var ov=document.createElement("div");
        ov.id="finding-pane-overlay";
        ov.className="finding-pane-overlay";
        ov.onclick=closeFindingPane;
        ov.style.display="none";
        document.body.appendChild(ov);
        var pn=document.createElement("div");
        pn.id="finding-pane";
        pn.className="finding-pane";
        pn.style.display="none";
        document.body.appendChild(pn);
        document.addEventListener("keydown",function(e){
            if(e.key==="Escape"){
                var tierPane=document.getElementById("tier-pane");
                if(tierPane&&tierPane.style.display!=="none"){ closeTierPane(); return; }
                var dbPane=document.getElementById("db-detail-pane");
                if(dbPane&&dbPane.style.display!=="none")closeDbDetailPane();
                else closeFindingPane();
            }
        });
    }
}
document.addEventListener("DOMContentLoaded",renderReport);

    </script>
